<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@400&display=swap");
      html,
      body {
        margin: 0;
        width: 1440px;
        height: 900px;
        background: #0a1014;
        color: #e9ece6;
        display: grid;
        place-items: center;
      }
      .wrap {
        text-align: center;
        font-family: "Chakra Petch", sans-serif;
      }
      h1 {
        margin: 0 0 22px;
        font-size: 68px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0;
        font-family: "IBM Plex Mono", monospace;
        color: #9fd8c2;
        font-size: 20px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Resolved is not Settled.</h1>
      <p>Settleye</p>
    </div>
  </body>
</html>
